<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Reaction</title>
 
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 id="turn-indicator" class="red-text">Red's turn</h2>

<div id="timers" style="text-align: center; margin-bottom: 10px;">
    <p>Turn Timer: <span id="turn-time">15</span>s</p>
    <p>Total Time Left: <span id="total-time">300</span>s</p>
</div>

<div id="scoreboard">
    <div class="score-box red-score-box">Red's Score: <span id="red-score">0</span></div>
    <div class="score-box blue-score-box">Blue's Score: <span id="blue-score">0</span></div>
</div>

    <div id="board-container"></div>

    <button id="restart-button">Restart</button>

    <button id="pause-button">Pause</button>

    <script src="script.js"></script>
    
</body>
</html>
